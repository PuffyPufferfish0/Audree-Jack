<!DOCTYPE html>

<head>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {

                            50: '#faf7f2',
                            100: '#f4eee1',
                            200: '#ece2cf',
                            300: '#dfd2b5',
                            800: '#5c5240',

                            500: '#6b7d56',
                            600: '#5a6b47',
                            700: '#3f4e30',
                            800: '#2d3822',
                        },
                        rose: {
                             watercolor: '#d88390',

                             light: '#f2cfd5',

                    fontFamily: {
                        script: ['"Alex Brush"', 'cursive'],
                        serif: ['"Cormorant Garamond"', 'serif'],

    <style>
        /* Custom Parchment Background Texture & Styles */
        body {
            background-color: #f4eee1;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(216, 131, 144, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(90, 107, 71, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(236, 226, 207, 0.5) 0%, rgba(223, 210, 181, 0.3) 100%);
            color: #3f4e30;
            font-family: 'Cormorant Garamond', serif;
        }

        /* Glassmorphism Card Style with Aged Paper Feel */
        .parchment-card {
            background: rgba(250, 247, 242, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(223, 210, 181, 0.8);
            box-shadow: 0 10px 30px -5px rgba(63, 78, 48, 0.08), 0 0 15px rgba(216, 131, 144, 0.05);
        }

        .gold-border {
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* Floating Botanical Decorative Animation */
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        .floating-botanical {
            animation: float-slow 8s ease-in-out infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f4eee1;
        }
        ::-webkit-scrollbar-thumb {
            background: #c46877;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden selection:bg-rose-light selection:text-botanical-800">

    <!-- Subtle Background Botanical SVGs (Top Left & Bottom Right) -->
    <div class="fixed top-0 left-0 w-48 sm:w-80 pointer-events-none z-0 opacity-40 floating-botanical">
        <svg viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10,10 Q50,120 100,180 T180,280" stroke="#5a6b47" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <!-- Vines & Leaves -->
            <path d="M45,90 Q20,70 15,40 Q40,55 45,90 Z" fill="#6b7d56" opacity="0.7"/>
            <path d="M70,140 Q40,130 30,105 Q60,115 70,140 Z" fill="#5a6b47" opacity="0.8"/>
            <path d="M110,195 Q85,200 70,180 Q95,170 110,195 Z" fill="#6b7d56" opacity="0.7"/>
            <!-- Orchid Flowers Pink -->
            <path d="M35,65 C20,40 5,60 25,75 C45,90 50,70 35,65 Z" fill="#d88390" opacity="0.75"/>
            <path d="M85,120 C65,100 50,120 70,135 C90,150 95,130 85,120 Z" fill="#c46877" opacity="0.8"/>
        </svg>
    </div>

    <div class="fixed bottom-0 right-0 w-48 sm:w-80 pointer-events-none z-0 opacity-40 floating-botanical" style="animation-delay: -4s;">
        <svg viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg" class="transform rotate-180">
            <path d="M10,10 Q50,120 100,180 T180,280" stroke="#5a6b47" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M45,90 Q20,70 15,40 Q40,55 45,90 Z" fill="#6b7d56" opacity="0.7"/>
            <path d="M70,140 Q40,130 30,105 Q60,115 70,140 Z" fill="#5a6b47" opacity="0.8"/>
            <path d="M35,65 C20,40 5,60 25,75 C45,90 50,70 35,65 Z" fill="#d88390" opacity="0.75"/>
            <path d="M85,120 C65,100 50,120 70,135 C90,150 95,130 85,120 Z" fill="#c46877" opacity="0.8"/>
        </svg>
    </div>

    <!-- Navigation Header -->


    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-8 relative z-10 space-y-16 sm:space-y-24">

        <!-- HERO / INVITATION SECTION -->
        <section id="hero" class="pt-6 sm:pt-12 text-center">
            <div class="parchment-card rounded-3xl p-8 sm:p-14 relative overflow-hidden border-2 border-parchment-300/60 shadow-xl max-w-2xl mx-auto">
                
                <!-- Inner Watercolor Frame Borders -->
                <div class="absolute inset-3 border border-botanical-500/20 rounded-2xl pointer-events-none"></div>
                <div class="absolute inset-5 border border-rose-dark/20 rounded-xl pointer-events-none"></div>

                <!-- Subtitle -->
                <p class="font-sans text-xs sm:text-sm tracking-widest uppercase text-botanical-600 mb-6 font-medium">
                    Save The Date
                </p>

                <!-- Script Names Header -->
                <h1 class="font-script text-6xl sm:text-8xl text-botanical-800 leading-none mb-2">
                    Audree
                </h1>
                <div class="font-script text-4xl sm:text-5xl text-rose-dark my-1">&</div>
                <h1 class="font-script text-6xl sm:text-8xl text-botanical-800 leading-none mb-8">
                    Jack
                </h1>

                <!-- Core Invitation Message -->
                <p class="font-serif text-lg sm:text-xl text-botanical-700 italic max-w-md mx-auto mb-6 leading-relaxed">
                    Please join us to celebrate the wedding of
                </p>

                <p class="font-sans font-semibold text-sm sm:text-base text-botanical-800 tracking-wider uppercase mb-6">
                    Audree Testa & Jack Anderson
                </p>

                <!-- Date & Location Banner -->
                <div class="my-8 py-4 border-y border-parchment-300 max-w-xs mx-auto">
                    <p class="font-serif text-2xl sm:text-3xl font-semibold text-rose-dark tracking-wide">
                        MAY 23 <span class="text-lg font-normal text-botanical-700">@ 4 PM</span>
                    </p>
                    <p class="font-serif text-lg text-botanical-700 mt-1">
                        2180 Inwood Rd
                    </p>
                </div>

                <p class="font-serif text-md sm:text-lg text-botanical-600 italic">
                    Reception following later in the evening at Dove Church
                </p>

                <!-- Action Buttons -->
                <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
                    <button onclick="openRsvpModal()" class="w-full sm:w-auto px-8 py-3 bg-rose-watercolor hover:bg-rose-dark text-white font-sans text-xs tracking-widest uppercase rounded-full shadow-md transition-all duration-300 transform hover:-translate-y-0.5">
                        <i class="fa-regular fa-envelope mr-2"></i> RSVP Now
                    </button>
                </div>
            </div>
        </section>


    <!-- FOOTER -->


    <!-- JavaScript Interactions -->
    <script>
        // Set target wedding date: May 23 @ 4:00 PM
        // Uses current year or next upcoming May 23
        const getWeddingDate = () => {
            const now = new Date();
            let year = now.getFullYear();
            let weddingDate = new Date(`May 23, ${year} 16:00:00`);
            if (now > weddingDate) {
                weddingDate = new Date(`May 23, ${year + 1} 16:00:00`);
            }
            return weddingDate;
        };

        const weddingDate = getWeddingDate();

        // Live Countdown Timer
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            if (distance < 0) {
                document.getElementById('countdown').innerHTML = "<div class='col-span-4 font-serif text-2xl text-rose-dark'>The Celebration Has Begun!</div>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Navigation Toggle
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        }

        // Add To Calendar (.ics File Generator)
        function addToCalendar() {
            const icsData = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//Audree and Jack Wedding//EN",
                "BEGIN:VEVENT",
                "SUMMARY:Audree & Jack's Wedding",
                "DESCRIPTION:Please join us to celebrate the wedding of Audree Testa & Jack Anderson. Reception following at Dove Church.",
                "LOCATION:2180 Inwood Rd",
                "DTSTART:20260523T160000",
                "DTEND:20260523T220000",
                "END:VEVENT",
                "END:VCALENDAR"
            ].join("\n");

            const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', 'Audree_and_Jack_Wedding.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
